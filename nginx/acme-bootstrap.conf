# Temporary HTTP-only site used to obtain the first Let's Encrypt certificate.
# Replace REPLACE_DOMAIN before enabling this site.
server {
    listen 80;
    listen [::]:80;
    server_name REPLACE_DOMAIN;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
