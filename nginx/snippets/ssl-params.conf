# Ubuntu 22.04 / Nginx 1.18+ 推荐 SSL 参数
# 用法：在 server { listen 443 ssl; } 块内 include snippets/ssl-params.conf;
# 证书路径由 certbot 自动写入，或手动指定 ssl_certificate / ssl_certificate_key

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;

ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# 现代浏览器默认密码套件（TLS 1.3 自动协商）
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

# OCSP Stapling（certbot 证书通常可用）
ssl_stapling on;
ssl_stapling_verify on;
# OCSP 响应验证需要签发链、中间 CA 与根 CA 信任库（Ubuntu ca-certificates）。
ssl_trusted_certificate /etc/nginx/ssl-trusted-chain.pem;
resolver 8.8.8.8 8.8.4.4 valid=300s;
resolver_timeout 5s;
