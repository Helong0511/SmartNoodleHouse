# =============================================================================
# SmartNoodleHouse — Nginx 站点配置（Ubuntu 22.04.5）
#
# 部署路径默认：/var/www/smart-noodle
# 安装：见同目录 安装说明.txt
#
# 部署前必改（搜索 REPLACE_）：
#   REPLACE_DOMAIN          → 你的域名，如 order.example.com
#   REPLACE_WEB_ROOT        → 前端构建产物，默认 /var/www/smart-noodle/frontend/dist
#   REPLACE_UPLOADS_DIR     → 上传目录，默认 /var/www/smart-noodle/uploads
# =============================================================================

# WebSocket 升级（厨房 KDS / 叫号屏）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP → HTTPS 强制跳转
server {
    listen 80;
    listen [::]:80;
    server_name REPLACE_DOMAIN;

    # certbot 首次申请证书时可临时注释下一行，申请完成后恢复
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name REPLACE_DOMAIN;

    # certbot --nginx -d REPLACE_DOMAIN 会自动写入；手动部署时取消注释并改路径
    # ssl_certificate     /etc/letsencrypt/live/REPLACE_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/REPLACE_DOMAIN/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # .env 原始图片上限默认 5MB；JSON Base64 约增加 4/3 体积，Nginx 需留出编码开销。
    client_max_body_size 7m;

    access_log /var/log/nginx/smart-noodle.access.log;
    error_log  /var/log/nginx/smart-noodle.error.log warn;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' wss: https:;" always;

    root REPLACE_WEB_ROOT;
    index index.html;

    # 探活/就绪（exact match 优先于 SPA；勿落到 index.html 假绿）
    location = /health {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://127.0.0.1:8000;
    }
    location = /ready {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://127.0.0.1:8000;
    }

    # 前端 SPA（后台 / 厨房 KDS / 叫号屏 / H5 扫码页）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（Vite 构建带 hash）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API 反代（小程序、支付回调、外卖 notify）
    location /api/ {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_pass http://127.0.0.1:8000;
    }

    # WebSocket：厨房 KDS、顾客叫号屏
    location /api/ws/ {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://127.0.0.1:8000;
    }

    # 摄像头 MJPEG 流：默认仅内网（部署时按店内网段改 allow）
    location /api/cameras/ {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Stream-Ticket $http_x_stream_ticket;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_pass http://127.0.0.1:8000;
    }

    # 顾客头像属于个人资料，所有本地/S3 头像统一经 /api/media/private/avatars 短时签名读取。
    # 禁止通过静态 uploads alias 绕过签名、过期和数据库引用校验。
    location ^~ /uploads/avatars/ {
        return 404;
    }

    # 用户上传的公开静态文件（餐品图等）；顾客头像和访客抓拍由上方规则禁止直出。
    # 管理端必须使用 /api/cameras/visitors/snapshot/{event_id} 的短时签名 URL。
    location ^~ /uploads/visitors/ {
        return 404;
    }

    location /uploads/ {
        alias REPLACE_UPLOADS_DIR/;
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
        # 显式声明 webp，避免旧系统 mime.types 缺失导致小程序无法解码
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            image/webp webp;
            application/octet-stream bin;
        }
        location ~* \.(php|jsp|asp|aspx|cgi|sh|py|pl)$ {
            deny all;
        }
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
