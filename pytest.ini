[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
pythonpath = backend
# 同时收集中文历史测试与标准英文 pytest 测试；此前英文测试被静默排除。
python_files = 测试_*.py test_*.py
# 独立广告追踪 DLL 子项目使用自己的工具链，不混入 FastAPI 后端测试。
# P1: coverage gate — 关键服务覆盖率防线
addopts = --strict-markers --ignore=tests/广告追踪
markers =
    mysql: needs real MySQL 8 (CI mysql job); skipped on SQLite
