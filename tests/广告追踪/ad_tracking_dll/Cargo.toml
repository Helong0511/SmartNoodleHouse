[package]
name = "ad_tracking_engine"
version = "1.1.0"
edition = "2021"
rust-version = "1.74"

[lib]
name = "ad_tracking_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
aes-gcm = { version = "0.10", features = ["aes"] }
base64 = "0.22"
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7"] }
once_cell = "1"

[dev-dependencies]
proptest = "1"
criterion = "0.5"

[[bench]]
name = "benchmark"
harness = false

[build-dependencies]
winres = "0.1"