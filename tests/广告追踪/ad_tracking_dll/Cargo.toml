[package]
name = "ad_tracking_engine"
version = "1.1.0"
edition = "2021"
# aes-gcm 0.11.x 与 proptest 1.12.x 的最低 Rust 版本为 1.88。
rust-version = "1.88"

[lib]
name = "ad_tracking_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
aes-gcm = { version = "0.11.1", features = ["aes"] }
base64 = "0.23.1"
hex = "0.4"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.1", features = ["v7"] }
once_cell = "1.21.4"

[dev-dependencies]
proptest = "1.12.0"
criterion = "0.8.2"

[[bench]]
name = "benchmark"
harness = false

[build-dependencies]
winres = "0.1.12"

# 商业发布版加固：优化、LTO、去符号、无增量、无调试信息
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
overflow-checks = false
