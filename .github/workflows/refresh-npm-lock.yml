name: One-time npm lock refresh
# Run only on the explicit refresh commit; subsequent branch pushes are ignored.

on:
  push:
    branches: ["fix/comprehensive-audit-2026-11-04"]

permissions:
  contents: write

jobs:
  refresh:
    if: github.ref == 'refs/heads/fix/comprehensive-audit-2026-11-04' && github.event.head_commit.message == 'ci: regenerate npm lockfile with security fixes'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Regenerate lockfile and remediate advisories
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only
          npm ci
          npm audit --audit-level=high
          npm test --if-present
          npm run build
      - name: Commit refreshed npm dependency graph
        run: |
          if git -C .. diff --quiet -- frontend/package.json frontend/package-lock.json; then
            echo "No dependency lock changes."
            exit 0
          fi
          git -C .. config user.name "github-actions[bot]"
          git -C .. config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .. add frontend/package.json frontend/package-lock.json
          git -C .. commit -m "fix(deps): refresh npm lockfile and security patches"
          git -C .. push origin "HEAD:${GITHUB_REF_NAME}"
