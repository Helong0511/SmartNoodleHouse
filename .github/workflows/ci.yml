name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.lock ]; then
            pip install -r backend/requirements.lock
          else
            pip install -r backend/requirements.txt
          fi
          pip install pytest pytest-asyncio httpx
      - name: Run unit tests
        env:
          PYTHONPATH: backend
          APP_ENV: development
          APP_DEBUG: "true"
          JWT_SECRET: "ci-test-jwt-secret-at-least-32-chars!!"
          FACE_ENCRYPTION_KEY: "ci-test-face-encryption-key-32b!!"
          ALLOW_PAYMENT_MOCK: "true"
          ALLOW_AUTH_MOCK: "true"
          ALLOW_DELIVERY_MOCK: "true"
        run: python -m pytest -q --ignore=tests/test_concurrency_stock.py
