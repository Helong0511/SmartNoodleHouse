name: CI

on:
  # Mainline branches run CI on push. Feature/fix/integration branches are
  # validated by pull_request only, avoiding duplicate full test suites for
  # the same commit (push + pull_request).
  push:
    branches: [main, master, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do not cancel an active full test run; a newer pending run validates latest SHA.
  cancel-in-progress: false

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7.4.12-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.lock ]; then
            pip install -r backend/requirements.lock
          else
            pip install -r backend/requirements.txt
          fi
          python -m pip install packaging
          python scripts/check_requirements_lock.py
          pip install -r tests/requirements.txt
          python -m pip check
      - name: Smoke-test face recognition binary dependency imports
        run: |
          python - <<'PY'
          import cv2
          import numpy
          import onnxruntime
          import websockets
          from insightface.app import FaceAnalysis
          from uvicorn.protocols.websockets.websockets_sansio_impl import WebSocketsSansIOProtocol

          assert numpy.__version__ == "2.4.6", numpy.__version__
          assert onnxruntime.__version__ == "1.31.1", onnxruntime.__version__
          assert websockets.__version__ == "17.4", websockets.__version__
          assert WebSocketsSansIOProtocol is not None
          print("OpenCV", cv2.__version__, "NumPy", numpy.__version__, "ONNX Runtime", onnxruntime.__version__)
          print("websockets", websockets.__version__, "Uvicorn SansIO: OK")
          print("InsightFace FaceAnalysis import: OK")
          PY
      - name: Verify real Redis 7.4 Lua, lock and cache behavior
        env:
          REDIS_TEST_URL: "redis://127.0.0.1:6379/15"
          PYTHONPATH: backend
          APP_ENV: development
        run: python -m pytest -q tests/测试_Redis真实服务集成.py
      - name: Start disposable MinIO for S3 adapter integration
        run: |
          # Pin the verified linux/amd64 manifest digest; the CI runner is ubuntu-latest.
          docker run -d --name smart-noodle-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            dappros/minio@sha256:a1a8bd4ac40ad7881a245bab97323e18f971e4d4cba2c2007ec1bedd21cbaba2 server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              echo "MinIO is ready"
              exit 0
            fi
            sleep 2
          done
          docker logs smart-noodle-minio
          echo "MinIO did not become ready" >&2
          exit 1
      - name: Verify boto3 S3 adapter against real MinIO
        env:
          PYTHONPATH: backend
          APP_ENV: development
          S3_TEST_ENDPOINT: "http://127.0.0.1:9000"
          S3_TEST_ACCESS_KEY: minioadmin
          S3_TEST_SECRET_KEY: minioadmin
        run: python -m pytest -q tests/test_s3_object_storage_minio.py
      - name: Verify tracked text encoding and line endings
        run: |
          python scripts/check_text_encoding.py
      - name: Check duplicate Python imports
        run: python scripts/check_duplicate_imports.py
      - name: Audit backend dependency references
        run: python scripts/check_python_dependency_usage.py
      - name: Compile check
        run: |
          python -m compileall backend/app -q
      - name: Verify production ASGI worker launch configuration
        run: |
          grep -F 'REPLACE_DEPLOY_ROOT/backend/.venv/bin/uvicorn app.main:app' systemd/smart-noodle.service
          grep -F -- '--workers 2' systemd/smart-noodle.service
          grep -F -- '--timeout-graceful-shutdown 30' systemd/smart-noodle.service
          if grep -Eq 'gunicorn|uvicorn[.]workers[.]UvicornWorker' systemd/smart-noodle.service; then
            echo "Deprecated or removed ASGI worker launch path found" >&2
            exit 1
          fi
          python -m uvicorn --help | grep -F -- '--workers'
          python - <<'PY'
          import os
          import socket
          import subprocess
          import sys
          import tempfile
          import time
          from pathlib import Path
          from urllib.error import URLError
          from urllib.request import urlopen

          with tempfile.TemporaryDirectory(prefix="uvicorn-worker-smoke-") as tmp:
              app_file = Path(tmp) / "uvicorn_smoke.py"
              app_file.write_text(
                  "async def app(scope, receive, send):\n"
                  "    if scope['type'] == 'http':\n"
                  "        await send({'type': 'http.response.start', 'status': 200, "
                  "'headers': [(b'content-type', b'text/plain')]})\n"
                  "        await send({'type': 'http.response.body', 'body': b'uvicorn-workers-ok'})\n",
                  encoding="utf-8",
              )
              with socket.socket() as sock:
                  sock.bind(("127.0.0.1", 0))
                  port = sock.getsockname()[1]
              env = os.environ.copy()
              env["PYTHONPATH"] = os.pathsep.join(filter(None, [tmp, env.get("PYTHONPATH", "")]))
              log_path = Path(tmp) / "uvicorn-smoke.log"
              with log_path.open("w", encoding="utf-8") as log_file:
                  process = subprocess.Popen(
                      [
                          sys.executable, "-m", "uvicorn", "uvicorn_smoke:app",
                          "--host", "127.0.0.1", "--port", str(port), "--workers", "2",
                          "--timeout-graceful-shutdown", "5",
                      ],
                      env=env,
                      stdout=log_file,
                      stderr=subprocess.STDOUT,
                      text=True,
                  )
              try:
                  for _ in range(40):
                      if process.poll() is not None:
                          raise RuntimeError(f"Uvicorn worker manager exited early: {log_path.read_text(encoding='utf-8')}")
                      try:
                          with urlopen(f"http://127.0.0.1:{port}/", timeout=0.5) as response:
                              body = response.read()
                          if body != b"uvicorn-workers-ok":
                              raise AssertionError(f"Unexpected ASGI response: {body!r}")
                          break
                      except (URLError, TimeoutError, ConnectionError):
                          time.sleep(0.25)
                  else:
                      raise TimeoutError("Uvicorn native two-worker process manager did not become ready")
              finally:
                  if process.poll() is None:
                      process.terminate()
                      try:
                          process.wait(timeout=10)
                      except subprocess.TimeoutExpired:
                          process.kill()
                          process.wait(timeout=5)
              if process.returncode not in (0, -15):
                  raise RuntimeError(f"Uvicorn worker manager shutdown failed: {log_path.read_text(encoding='utf-8')}")
          print("Uvicorn native two-worker startup, HTTP response and shutdown: OK")
          PY
      - name: Store isolation guard check
        run: |
          python "scripts/检查门店隔离.py"
      - name: Detect unawaited DB cursor warnings in marketing serialization
        env:
          PYTHONPATH: backend
          APP_ENV: development
          APP_DEBUG: "true"
          JWT_SECRET: "ci-test-jwt-secret-at-least-32-chars!!"
          FACE_ENCRYPTION_KEY: "ci-test-face-encryption-key-32b!!"
          ALLOW_PAYMENT_MOCK: "true"
          ALLOW_AUTH_MOCK: "true"
          ALLOW_DELIVERY_MOCK: "true"
          REDIS_TEST_URL: "redis://127.0.0.1:6379/15"
        run: python -m pytest -q tests/测试_营销分群活动.py::test_campaign_payload_for_includes_created_by_name -W error::RuntimeWarning
      - name: Verify concurrent settings reads do not leak unawaited DB cursors
        env:
          PYTHONPATH: backend
          APP_ENV: development
          APP_DEBUG: "true"
          JWT_SECRET: "ci-test-jwt-secret-at-least-32-chars!!"
          FACE_ENCRYPTION_KEY: "ci-test-face-encryption-key-32b!!"
          REDIS_TEST_URL: "redis://127.0.0.1:6379/15"
        run: python -m pytest -q tests/测试_设置并发.py::test_extreme_concurrent_get_int -W error::RuntimeWarning
      - name: Run unit tests with coverage
        env:
          PYTHONPATH: backend
          APP_ENV: development
          APP_DEBUG: "true"
          JWT_SECRET: "ci-test-jwt-secret-at-least-32-chars!!"
          FACE_ENCRYPTION_KEY: "ci-test-face-encryption-key-32b!!"
          ALLOW_PAYMENT_MOCK: "true"
          ALLOW_AUTH_MOCK: "true"
          ALLOW_DELIVERY_MOCK: "true"
          REDIS_TEST_URL: "redis://127.0.0.1:6379/15"
          # 跟踪延迟回收的未等待协程，确保完整测试套件不吞掉 DB cursor 警告。
          PYTHONTRACEMALLOC: "10"
        run: |
          python -m pytest -q --tb=short \
            -W error::RuntimeWarning \
            -W error::pytest.PytestUnraisableExceptionWarning \
            --cov=app --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=35


  dependency-lock-consistency:
    name: dependency-lock-consistency
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock
          python -m pip install packaging
      - name: Regenerate and validate the full runtime lock
        run: |
          python scripts/生成依赖锁定文件.py
          python scripts/check_requirements_lock.py
      - name: Publish regenerated runtime lock for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-requirements-lock
          path: backend/requirements.lock
          if-no-files-found: error
          retention-days: 3
      - name: Require committed runtime lock to match the resolved closure
        run: git diff --exit-code -- backend/requirements.lock

  backend-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: smart_noodle_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.lock ]; then
            pip install -r backend/requirements.lock
          else
            pip install -r backend/requirements.txt
          fi
          python -m pip install packaging
          python scripts/check_requirements_lock.py
          pip install -r tests/requirements.txt
      - name: Prepare database
        env:
          MYSQL_PWD: root
        run: |
          # MYSQL_DATABASE pre-creates the schema using the server default collation;
          # CREATE DATABASE IF NOT EXISTS would not change that existing schema.
          mysql -h 127.0.0.1 -uroot -e "ALTER DATABASE smart_noodle_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
      - name: Upgrade empty MySQL schema to latest Alembic revision
        working-directory: backend
        env:
          PYTHONPATH: .
          APP_ENV: development
          APP_DEBUG: "true"
          DATABASE_URL: "mysql+aiomysql://root:root@127.0.0.1:3306/smart_noodle_ci?charset=utf8mb4"
        run: alembic upgrade head
      - name: Verify MySQL store-scope migration downgrade and re-upgrade
        working-directory: backend
        env:
          PYTHONPATH: .
          APP_ENV: development
          APP_DEBUG: "true"
          DATABASE_URL: "mysql+aiomysql://root:root@127.0.0.1:3306/smart_noodle_ci?charset=utf8mb4"
        run: |
          alembic downgrade 0047_payment_refund_idem
          alembic upgrade head
      - name: Verify database charset, schema and migration head
        working-directory: .
        env:
          PYTHONPATH: backend
          APP_ENV: development
          APP_DEBUG: "true"
          DATABASE_URL: "mysql+aiomysql://root:root@127.0.0.1:3306/smart_noodle_ci?charset=utf8mb4"
        run: python scripts/验证数据库.py
      - name: Run MySQL-marked tests
        env:
          PYTHONPATH: backend
          APP_ENV: development
          APP_DEBUG: "true"
          TEST_DATABASE_URL: mysql+aiomysql://root:root@127.0.0.1:3306/smart_noodle_ci?charset=utf8mb4
          JWT_SECRET: "ci-test-jwt-secret-at-least-32-chars!!"
          FACE_ENCRYPTION_KEY: "ci-test-face-encryption-key-32b!!"
          ALLOW_PAYMENT_MOCK: "true"
          ALLOW_AUTH_MOCK: "true"
          ALLOW_DELIVERY_MOCK: "true"
        run: |
          python -m pytest -q --tb=short -m mysql \
            tests/测试_审计遗留加固.py tests/测试_数据库LeaderEpoch.py \
            tests/test_delivery_refund_fingerprint_migration.py

  frontend-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24", "26"]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pin npm to packageManager version
        run: |
          npm install --global npm@11.19.1
          test "$(npm --version)" = "11.19.1"
          node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (![24, 26].includes(major) || (major === 24 && minor < 12)) process.exit(1)"
      - name: Install dependencies
        run: npm ci
      - name: Check duplicate frontend and mini-program imports
        run: node scripts/check_duplicate_imports.mjs
      - name: Audit frontend dependency references
        run: node scripts/check_dependency_usage.mjs
      - name: Verify complete npm dependency tree
        run: npm ls --all
      - name: Unit tests
        run: npm test --if-present
      - name: Type check and build
        run: npm run build


  frontend-lockfile-consistency:
    name: frontend-lockfile-consistency
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pin npm lockfile writer
        run: |
          npm install --global npm@11.19.1
          test "$(npm --version)" = "11.19.1"
      - name: Verify lockfile is up to date with compatible stable releases
        run: npm update --package-lock-only --ignore-scripts
      - name: Install and verify refreshed dependency graph
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build
      - name: Publish generated lockfile for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-package-lock
          path: frontend/package-lock.json
          if-no-files-found: error
          retention-days: 3
      - name: Require committed npm lockfile to match compatible graph
        run: git diff --exit-code -- package-lock.json

  dependency-security-audit:
    name: dependency-security-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit --strict -r backend/requirements.lock
          # 测试依赖同样进入 CI 执行环境，避免开发/测试工具链漏洞被漏审。
          pip-audit --strict -r tests/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit npm dependencies
        working-directory: frontend
        run: |
          npm install --global npm@11.19.1
          test "$(npm --version)" = "11.19.1"
          npm ci
          npm audit --audit-level=high

  miniprogram-static-check:
    name: miniprogram-static-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Check WeChat and Alipay mini-program JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check --input-type=module < "$file"
          done < <(find miniprogram-wechat miniprogram-alipay -type f -name '*.js' -print0)
      - name: Verify mini-program release environment fails closed
        run: node scripts/test_miniprogram_env_fail_closed.cjs
      - name: Verify mini-program subscription gesture adapters
        run: node scripts/test_miniprogram_subscribe_gesture.cjs
      - name: Verify recharge idempotency survives package/store switching
        run: node scripts/test_recharge_idempotency_cache.cjs
      - name: Verify Alipay privacy consent fails closed when platform APIs are absent
        run: node scripts/test_alipay_privacy_fail_closed.cjs

  rust-ad-tracking:
    name: rust-ad-tracking (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.89.0", "stable"]
    defaults:
      run:
        working-directory: tests/广告追踪/ad_tracking_dll
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Verify declared MSRV and locked dependency graph
        run: |
          rustc --version
          cargo metadata --locked --format-version 1 > /dev/null
      - name: Check Rust formatting
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check
      - name: Audit Rust dependency graph
        if: matrix.toolchain == 'stable'
        run: cargo tree --locked -d
      - name: Audit Rust dependencies against RustSec
        if: matrix.toolchain == 'stable'
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit
      - name: Detect unused Rust dependencies
        if: matrix.toolchain == 'stable'
        run: |
          cargo install cargo-machete --locked --version 0.9.2
          cargo machete
      - name: Build and run Rust tests
        run: cargo test --locked --all-targets

  windows-rust-dll:
    name: windows-rust-dll
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tests/广告追踪/ad_tracking_dll
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify locked Windows DLL build
        shell: pwsh
        run: |
          rustc --version
          cargo metadata --locked --format-version 1 | Out-Null
          cargo test --locked
          cargo build --release --locked
          if (-not (Test-Path "target/release/ad_tracking_engine.dll")) {
            throw "Windows DLL was not produced"
          }

  windows-sapi-dependency:
    name: windows-sapi-dependency
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pinned Windows speech dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pywin32==312
          python -c "import win32api, win32com.client, pythoncom; print('pywin32 SAPI imports OK')"
