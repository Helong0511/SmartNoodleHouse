name: CI

on:
  # Mainline branches run CI on push. Feature/fix/integration branches are
  # validated by pull_request only, avoiding duplicate full test suites for
  # the same commit (push + pull_request).
  push:
    branches: [main, master, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do not cancel an active full test run; a newer pending run validates latest SHA.
  cancel-in-progress: false

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.lock ]; then
            pip install -r backend/requirements.lock
          else
            pip install -r backend/requirements.txt
          fi
          pip install -r tests/requirements.txt
          python scripts/check_requirements_lock.py
          python -m pip check
      - name: Smoke-test face recognition binary dependency imports
        run: |
          python - <<'PY'
          import cv2
          import numpy
          import onnxruntime
          from insightface.app import FaceAnalysis

          assert numpy.__version__ == "2.4.4", numpy.__version__
          assert onnxruntime.__version__ == "1.31.1", onnxruntime.__version__
          print("OpenCV", cv2.__version__, "NumPy", numpy.__version__, "ONNX Runtime", onnxruntime.__version__)
          print("InsightFace FaceAnalysis import: OK")
          PY
      - name: Verify tracked text encoding and line endings
        run: |
          python scripts/check_text_encoding.py
      - name: Check duplicate Python imports
        run: python scripts/check_duplicate_imports.py
      - name: Audit backend dependency references
        run: python scripts/check_python_dependency_usage.py
      - name: Compile check
        run: |
          python -m compileall backend/app -q
      - name: Store isolation guard check
        run: |
          python "scripts/检查门店隔离.py"
      - name: Detect unawaited DB cursor warnings in marketing serialization
        env:
          PYTHONPATH: backend
          APP_ENV: development
          APP_DEBUG: "true"
          JWT_SECRET: "ci-test-jwt-secret-at-least-32-chars!!"
          FACE_ENCRYPTION_KEY: "ci-test-face-encryption-key-32b!!"
          ALLOW_PAYMENT_MOCK: "true"
          ALLOW_AUTH_MOCK: "true"
          ALLOW_DELIVERY_MOCK: "true"
          REDIS_TEST_URL: "redis://127.0.0.1:6379/15"
        run: python -m pytest -q tests/测试_营销分群活动.py::test_campaign_payload_for_includes_created_by_name -W error::RuntimeWarning
      - name: Run unit tests with coverage
        env:
          PYTHONPATH: backend
          APP_ENV: development
          APP_DEBUG: "true"
          JWT_SECRET: "ci-test-jwt-secret-at-least-32-chars!!"
          FACE_ENCRYPTION_KEY: "ci-test-face-encryption-key-32b!!"
          ALLOW_PAYMENT_MOCK: "true"
          ALLOW_AUTH_MOCK: "true"
          ALLOW_DELIVERY_MOCK: "true"
          REDIS_TEST_URL: "redis://127.0.0.1:6379/15"
        run: |
          python -m pytest -q --tb=short \
            --cov=app --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=35

  backend-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: smart_noodle_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.lock ]; then
            pip install -r backend/requirements.lock
          else
            pip install -r backend/requirements.txt
          fi
          pip install -r tests/requirements.txt
          python scripts/check_requirements_lock.py
      - name: Prepare database
        env:
          MYSQL_PWD: root
        run: |
          # MYSQL_DATABASE pre-creates the schema using the server default collation;
          # CREATE DATABASE IF NOT EXISTS would not change that existing schema.
          mysql -h 127.0.0.1 -uroot -e "ALTER DATABASE smart_noodle_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
      - name: Upgrade empty MySQL schema to latest Alembic revision
        working-directory: backend
        env:
          PYTHONPATH: .
          APP_ENV: development
          APP_DEBUG: "true"
          DATABASE_URL: "mysql+aiomysql://root:root@127.0.0.1:3306/smart_noodle_ci?charset=utf8mb4"
        run: alembic upgrade head
      - name: Verify MySQL store-scope migration downgrade and re-upgrade
        working-directory: backend
        env:
          PYTHONPATH: .
          APP_ENV: development
          APP_DEBUG: "true"
          DATABASE_URL: "mysql+aiomysql://root:root@127.0.0.1:3306/smart_noodle_ci?charset=utf8mb4"
        run: |
          alembic downgrade 0047_payment_refund_idem
          alembic upgrade head
      - name: Verify database charset, schema and migration head
        working-directory: .
        env:
          PYTHONPATH: backend
          APP_ENV: development
          APP_DEBUG: "true"
          DATABASE_URL: "mysql+aiomysql://root:root@127.0.0.1:3306/smart_noodle_ci?charset=utf8mb4"
        run: python scripts/验证数据库.py
      - name: Run MySQL-marked tests
        env:
          PYTHONPATH: backend
          APP_ENV: development
          APP_DEBUG: "true"
          TEST_DATABASE_URL: mysql+aiomysql://root:root@127.0.0.1:3306/smart_noodle_ci?charset=utf8mb4
          JWT_SECRET: "ci-test-jwt-secret-at-least-32-chars!!"
          FACE_ENCRYPTION_KEY: "ci-test-face-encryption-key-32b!!"
          ALLOW_PAYMENT_MOCK: "true"
          ALLOW_AUTH_MOCK: "true"
          ALLOW_DELIVERY_MOCK: "true"
        run: |
          python -m pytest -q --tb=short -m mysql \
            tests/测试_审计遗留加固.py tests/测试_数据库LeaderEpoch.py

  frontend-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24", "26"]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pin npm to packageManager version
        run: |
          npm install --global npm@11.19.1
          test "$(npm --version)" = "11.19.1"
          node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (![24, 26].includes(major) || (major === 24 && minor < 12)) process.exit(1)"
      - name: Install dependencies
        run: npm ci
      - name: Check duplicate frontend and mini-program imports
        run: node scripts/check_duplicate_imports.mjs
      - name: Audit frontend dependency references
        run: node scripts/check_dependency_usage.mjs
      - name: Verify complete npm dependency tree
        run: npm ls --all
      - name: Unit tests
        run: npm test --if-present
      - name: Type check and build
        run: npm run build

  dependency-security-audit:
    name: dependency-security-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit --strict -r backend/requirements.lock
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit npm dependencies
        working-directory: frontend
        run: |
          npm install --global npm@11.19.1
          test "$(npm --version)" = "11.19.1"
          npm ci
          npm audit --audit-level=high

  miniprogram-static-check:
    name: miniprogram-static-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Check WeChat and Alipay mini-program JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check --input-type=module < "$file"
          done < <(find miniprogram-wechat miniprogram-alipay -type f -name '*.js' -print0)

  rust-dll-check:
    name: rust-dll-check (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.85.0", "stable"]
    defaults:
      run:
        working-directory: tests/广告追踪/ad_tracking_dll
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Verify locked Rust build and tests
        run: cargo test --locked
      - name: Report duplicate Rust crate versions
        run: cargo tree --duplicates
      - name: Install Rust unused-dependency checker
        if: matrix.toolchain == 'stable'
        run: cargo install cargo-machete --locked --version 0.9.2
      - name: Check unused Rust dependencies
        if: matrix.toolchain == 'stable'
        run: cargo machete
      - name: Install Rust dependency auditor
        if: matrix.toolchain == 'stable'
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependencies
        if: matrix.toolchain == 'stable'
        run: cargo audit --deny warnings
  windows-sapi-dependency:
    name: windows-sapi-dependency
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pinned Windows speech dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pywin32==312
          python -c "import win32api, win32com.client, pythoncom; print('pywin32 SAPI imports OK')"
