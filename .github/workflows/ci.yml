name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.lock ]; then
            pip install -r backend/requirements.lock
          else
            pip install -r backend/requirements.txt
          fi
          pip install pytest pytest-asyncio httpx pytest-cov
          python scripts/check_requirements_lock.py
      - name: Compile check
        run: |
          python -m compileall backend/app -q
      - name: Store isolation guard check
        run: |
          python "scripts/检查门店隔离.py"
      - name: Run unit tests with coverage
        env:
          PYTHONPATH: backend
          APP_ENV: development
          APP_DEBUG: "true"
          JWT_SECRET: "ci-test-jwt-secret-at-least-32-chars!!"
          FACE_ENCRYPTION_KEY: "ci-test-face-encryption-key-32b!!"
          ALLOW_PAYMENT_MOCK: "true"
          ALLOW_AUTH_MOCK: "true"
          ALLOW_DELIVERY_MOCK: "true"
        run: |
          python -m pytest -q --tb=short \
            --cov=app --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=35

  backend-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: smart_noodle_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.lock ]; then
            pip install -r backend/requirements.lock
          else
            pip install -r backend/requirements.txt
          fi
          pip install pytest pytest-asyncio httpx
          python scripts/check_requirements_lock.py
      - name: Prepare database
        env:
          MYSQL_PWD: root
        run: |
          mysql -h 127.0.0.1 -uroot -e "CREATE DATABASE IF NOT EXISTS smart_noodle_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
      - name: Run MySQL-marked tests
        env:
          PYTHONPATH: backend
          APP_ENV: development
          APP_DEBUG: "true"
          TEST_DATABASE_URL: mysql+aiomysql://root:root@127.0.0.1:3306/smart_noodle_ci?charset=utf8mb4
          JWT_SECRET: "ci-test-jwt-secret-at-least-32-chars!!"
          FACE_ENCRYPTION_KEY: "ci-test-face-encryption-key-32b!!"
          ALLOW_PAYMENT_MOCK: "true"
          ALLOW_AUTH_MOCK: "true"
          ALLOW_DELIVERY_MOCK: "true"
        run: |
          python -m pytest -q --tb=short -m mysql tests/测试_审计遗留加固.py

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test --if-present
      - name: Type check and build
        run: npm run build
