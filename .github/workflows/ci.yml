name: CI

on:
  # Mainline branches run CI on push. Feature/fix/integration branches are
  # validated by pull_request only, avoiding duplicate full test suites for
  # the same commit (push + pull_request).
  push:
    branches: [main, master, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do not cancel an active full test run; a newer pending run validates latest SHA.
  cancel-in-progress: false

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.lock ]; then
            pip install -r backend/requirements.lock
          else
            pip install -r backend/requirements.txt
          fi
          pip install -r tests/requirements.txt
          python scripts/check_requirements_lock.py
      - name: Verify tracked text encoding and line endings
        run: |
          python scripts/check_text_encoding.py
      - name: Verify critical native and ML dependency imports
        run: |
          python -c "import numpy, cv2, onnxruntime, insightface, websockets; print('NumPy', numpy.__version__, 'OpenCV', cv2.__version__, 'ONNX Runtime', onnxruntime.__version__, 'websockets', websockets.__version__)"
      - name: Compile check
        run: |
          python -m compileall backend/app -q
      - name: Store isolation guard check
        run: |
          python "scripts/检查门店隔离.py"
      - name: Run unit tests with coverage
        env:
          PYTHONPATH: backend
          APP_ENV: development
          APP_DEBUG: "true"
          JWT_SECRET: "ci-test-jwt-secret-at-least-32-chars!!"
          FACE_ENCRYPTION_KEY: "ci-test-face-encryption-key-32b!!"
          ALLOW_PAYMENT_MOCK: "true"
          ALLOW_AUTH_MOCK: "true"
          ALLOW_DELIVERY_MOCK: "true"
          REDIS_TEST_URL: "redis://127.0.0.1:6379/15"
        run: |
          python -m pytest -q --tb=short \
            --cov=app --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=35

  backend-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: smart_noodle_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.lock ]; then
            pip install -r backend/requirements.lock
          else
            pip install -r backend/requirements.txt
          fi
          pip install -r tests/requirements.txt
          python scripts/check_requirements_lock.py
      - name: Prepare database
        env:
          MYSQL_PWD: root
        run: |
          # MYSQL_DATABASE pre-creates the schema using the server default collation;
          # CREATE DATABASE IF NOT EXISTS would not change that existing schema.
          mysql -h 127.0.0.1 -uroot -e "ALTER DATABASE smart_noodle_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
      - name: Upgrade empty MySQL schema to latest Alembic revision
        working-directory: backend
        env:
          PYTHONPATH: .
          APP_ENV: development
          APP_DEBUG: "true"
          DATABASE_URL: "mysql+aiomysql://root:root@127.0.0.1:3306/smart_noodle_ci?charset=utf8mb4"
        run: alembic upgrade head
      - name: Verify MySQL store-scope migration downgrade and re-upgrade
        working-directory: backend
        env:
          PYTHONPATH: .
          APP_ENV: development
          APP_DEBUG: "true"
          DATABASE_URL: "mysql+aiomysql://root:root@127.0.0.1:3306/smart_noodle_ci?charset=utf8mb4"
        run: |
          alembic downgrade 0047_payment_refund_idem
          alembic upgrade head
      - name: Verify database charset, schema and migration head
        working-directory: .
        env:
          PYTHONPATH: backend
          APP_ENV: development
          APP_DEBUG: "true"
          DATABASE_URL: "mysql+aiomysql://root:root@127.0.0.1:3306/smart_noodle_ci?charset=utf8mb4"
        run: python scripts/验证数据库.py
      - name: Run MySQL-marked tests
        env:
          PYTHONPATH: backend
          APP_ENV: development
          APP_DEBUG: "true"
          TEST_DATABASE_URL: mysql+aiomysql://root:root@127.0.0.1:3306/smart_noodle_ci?charset=utf8mb4
          JWT_SECRET: "ci-test-jwt-secret-at-least-32-chars!!"
          FACE_ENCRYPTION_KEY: "ci-test-face-encryption-key-32b!!"
          ALLOW_PAYMENT_MOCK: "true"
          ALLOW_AUTH_MOCK: "true"
          ALLOW_DELIVERY_MOCK: "true"
        run: |
          python -m pytest -q --tb=short -m mysql \
            tests/测试_审计遗留加固.py tests/测试_数据库LeaderEpoch.py

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pin npm to packageManager version
        run: |
          npm install --global npm@11.19.1
          test "$(npm --version)" = "11.19.1"
          node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major !== 24 || minor < 12) process.exit(1)"
      - name: Install dependencies
        run: npm ci
      - name: Verify npm dependency graph
        run: npm ls --all
      - name: Unit tests
        run: npm test --if-present
      - name: Type check and build
        run: npm run build

  dependency-security-audit:
    name: dependency-security-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit --strict -r backend/requirements.lock
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit npm dependencies
        working-directory: frontend
        run: |
          npm install --global npm@11.19.1
          test "$(npm --version)" = "11.19.1"
          npm ci
          npm audit --audit-level=high


  dependency-usage-audit:
    name: dependency-usage-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install application dependencies and static dependency checker
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.lock
          python -m pip install pip-check-reqs==3.1.0 ruff
      - name: Find undeclared Python imports
        run: |
          pip-missing-reqs --use-gitignore --requirements-file backend/requirements.txt backend/app scripts
      - name: Find unused direct Python requirements
        run: |
          pip-extra-reqs --use-gitignore --skip-incompatible \
            --requirements-file backend/requirements.txt \
            --ignore-requirement=gunicorn \
            --ignore-requirement=uvicorn \
            --ignore-requirement=websockets \
            --ignore-requirement=aiomysql \
            --ignore-requirement=pymysql \
            --ignore-requirement=onnxruntime \
            --ignore-requirement=bcrypt \
            backend/app scripts
      - name: Detect unused and duplicate Python imports
        run: ruff check --select F401,F811 backend/app scripts tests

  rust-ad-tracking-dll:
    name: rust-ad-tracking-dll
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests/广告追踪/ad_tracking_dll
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify Rust formatting
        run: cargo fmt --all -- --check
      - name: Compile and test the DLL core with the committed lockfile
        run: cargo test --locked
      - name: Lint all Rust targets
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Find unused Rust dependencies
        run: |
          cargo install cargo-machete --locked
          cargo machete

  miniprogram-static-check:
    name: miniprogram-static-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Check WeChat and Alipay mini-program JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check --input-type=module < "$file"
          done < <(find miniprogram-wechat miniprogram-alipay -type f -name '*.js' -print0)

  windows-sapi-dependency:
    name: windows-sapi-dependency
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pinned Windows speech dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pywin32==312
          python -c "import win32api, win32com.client, pythoncom; print('pywin32 SAPI imports OK')"
