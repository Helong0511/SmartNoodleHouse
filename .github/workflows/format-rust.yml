name: One-shot Rust formatting

on:
  push:
    branches:
      - chore/dependency-audit-unused-imports-cn-comments-2026-11-08

permissions:
  contents: read

jobs:
  rustfmt:
    if: contains(github.event.head_commit.message, '[format-rust]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        working-directory: tests/广告追踪/ad_tracking_dll
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Format all Rust source files
        run: cargo fmt --all
      - name: Commit formatting changes
        shell: bash
        run: |
          if git diff --quiet -- tests/广告追踪/ad_tracking_dll; then
            echo "Rust sources already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/广告追踪/ad_tracking_dll
          git commit -m "style(rust): apply rustfmt"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
