name: picomatch API compatibility experiment

on:
  push:
    branches:
      - experiment/picomatch-api-compat
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Override picomatch with compatibility package
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps --install-links --no-audit --no-fund
      - name: Verify dependency tree
        run: |
          node -e "const p=require.resolve('picomatch/package.json'); const m=require(p); console.log('resolved',p,'version',m.version,'deps',m.dependencies); if (m.name !== 'picomatch' || m.dependencies?.minimatch !== '^11.0.9') process.exit(1); const pm=require('picomatch'); if (typeof pm !== 'function' || typeof pm.isMatch !== 'function' || typeof pm.makeRe !== 'function') process.exit(1); console.log('compat API OK')"
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Unit tests
        run: npm test -- --run
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npm run test:e2e -- --project=chromium
