name: picomatch API compatibility experiment

on:
  push:
    branches:
      - experiment/picomatch-api-compat
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Override picomatch with compatibility package
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps --install-links --no-audit --no-fund
      - name: Verify dependency tree
        run: |
          node -e "const fs=require('fs'),path=require('path'); const entry=require.resolve('picomatch'); const m=JSON.parse(fs.readFileSync(path.resolve(entry,'../package.json'),'utf8')); console.log('resolved',entry,'version',m.version,'deps',m.dependencies); if (m.name !== 'picomatch' || m.dependencies?.minimatch !== '^11.0.9') process.exit(1); const pm=require('picomatch'); if (typeof pm !== 'function' || typeof pm.isMatch !== 'function' || typeof pm.makeRe !== 'function') process.exit(1); console.log('compat API OK')"
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/picomatch-preview.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          npx playwright test
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: picomatch-compat-playwright-diagnostics
          path: |
            frontend/test-results/
            frontend/playwright-report/
            ${{ runner.temp }}/picomatch-preview.log
          if-no-files-found: ignore
          retention-days: 3
