name: One-shot frontend lock refresh

on:
  push:
    branches:
      - chore/dependency-audit-unused-imports-cn-comments-2026-11-08

permissions:
  contents: read

jobs:
  refresh-frontend-lock:
    if: contains(github.event.head_commit.message, '[refresh-locks]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pin npm to the repository package manager version
        run: |
          npm install --global npm@11.19.1
          test "$(npm --version)" = "11.19.1"
      - name: Regenerate lockfile from npm registry
        working-directory: frontend
        run: npm update --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload candidate lockfile
        uses: actions/upload-artifact@v6
        with:
          name: frontend-package-lock-candidate
          path: frontend/package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify exact lock and production dependency tree
        working-directory: frontend
        run: |
          npm ci
          npm install-scripts ls
          npm ls --all
          npm audit --audit-level=high
      - name: Verify frontend type-check and build
        working-directory: frontend
        run: |
          npm test
          npm run build
      - name: Commit regenerated package lock
        shell: bash
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "Frontend package lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore(deps): refresh frontend package lock"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
