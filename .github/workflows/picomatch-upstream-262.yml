name: picomatch upstream PR 262 experiment

on:
  push:
    branches:
      - experiment/picomatch-upstream-262
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pin npm
        run: |
          npm install --global npm@11.19.1
          test "$(npm --version)" = "11.19.1"
      - name: Install committed dependencies
        run: npm ci
      - name: Install pinned upstream PR 262 commit for this experiment only
        run: |
          npm install --no-save --package-lock=false --ignore-scripts \
            github:jscraik/picomatch#3222059ac27492d9c0147fee5c65f751bbd851ab
          npm ls picomatch --all
      - name: Verify every Vite and Vitest consumer resolves the candidate
        run: |
          node --input-type=commonjs <<'NODE'
          const assert = require('node:assert/strict')
          const path = require('node:path')
          const { createRequire } = require('node:module')
          const root = require.resolve('picomatch')
          const meta = require('./node_modules/picomatch/package.json')
          assert.equal(meta.name, 'picomatch')
          assert.equal(meta.version, '4.0.7')
          const consumers = ['vite', 'vitest'].map(name => {
            const entry = require.resolve(name)
            const fromConsumer = createRequire(entry)
            const resolved = fromConsumer.resolve('picomatch')
            console.log(name, '->', resolved)
            assert.equal(path.resolve(resolved), path.resolve(root), name + ' did not resolve the candidate')
            return resolved
          })
          const pm = require('picomatch')
          assert.equal(typeof pm, 'function')
          for (const key of ['test', 'isMatch', 'makeRe', 'scan', 'parse', 'compileRe', 'matchBase']) {
            assert.equal(typeof pm[key], 'function', 'missing picomatch.' + key)
          }
          console.log('candidate package:', root, 'version:', meta.version, 'consumers:', consumers.length)
          NODE
      - name: Compare candidate matching with released 4.0.7 on a bounded corpus
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/picomatch-base"
          npm install --prefix "$RUNNER_TEMP/picomatch-base" --no-save --package-lock=false --ignore-scripts picomatch@4.0.7
          BASE_DIR="$RUNNER_TEMP/picomatch-base/node_modules/picomatch" node <<'NODE'
          const assert = require('node:assert/strict')
          const candidate = require('picomatch')
          const baseline = require(process.env.BASE_DIR)
          const patterns = [
            '+(*)', '*(*)', '+(*a)', '*(*a)', '+(a*)', '*(a*)',
            '+(a*b)', '*(a*b)', 'x+(*a)y', '+(*)c', '*(a*b)c',
            '+( a*)', '+(a* )', '*(a*|b)', '+(a*|b)',
            '+(ab*|c|d)', '*(ab*|c|d)', '+(A*|b)',
            '+(W*, *)', '*(W*, *)'
          ]
          const options = [
            {}, { dot: true }, { windows: true }, { bash: true },
            { nocase: true }, { flags: 'i' }, { flags: 's', bash: true },
            { contains: true }, { matchBase: true }
          ]
          const alphabet = ['a', 'b', 'A', 'c', '/', '\\\\', '.', '!', '\\n']
          let inputs = ['']
          let level = ['']
          for (let length = 1; length <= 4; length++) {
            level = level.flatMap(prefix => alphabet.map(char => prefix + char))
            inputs.push(...level)
          }
          inputs.push('W, ', 'W, W, ', 'xaaaay', 'cccabcccc', 'abab', 'aaa')
          let comparisons = 0
          for (const pattern of patterns) {
            for (const opts of options) {
              const before = baseline(pattern, opts)
              const after = candidate(pattern, opts)
              for (const input of inputs) {
                assert.equal(after(input), before(input),
                  JSON.stringify({ pattern, options: opts, input }))
                comparisons++
              }
            }
          }
          console.log('finite differential comparisons:', comparisons)
          NODE
      - name: Verify Vite and Vitest matcher options
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict')
          const pm = require('picomatch')
          const matcher = pm(['**/*.ts'], {
            noextglob: true, dot: true, nocase: true,
            ignore: ['**/node_modules/**']
          })
          assert.equal(matcher('src/App.ts'), true)
          assert.equal(matcher('src/.hidden/App.TS'), true)
          assert.equal(matcher('node_modules/pkg/index.ts'), false)
          assert.equal(pm('+(foo|bar)', { noextglob: true })('foo'), false)
          assert.equal(pm.isMatch('src/.internal/test.ts', ['**/*.ts'], { dot: true }), true)
          assert.equal(pm.isMatch('src/file.js', ['**/*.ts'], { dot: true }), false)
          console.log('Vite/Vitest matcher option checks passed')
          NODE
      - name: Bound adversarial ReDoS regressions in child processes
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict')
          const { spawnSync } = require('node:child_process')
          const patterns = [
            '+(*)', '*(*a)', '+(*a|b)', '+(a*a*a*a*a*)',
            '+([*a)', '+([*a])', '+(W*, *)z'
          ]
          const options = [{}, { windows: true }, { bash: true }, { capture: true }, { nobracket: true }]
          for (const pattern of patterns) {
            for (const opts of options) {
              const input = pattern.includes('W*,')
                ? 'W, '.repeat(10000) + '!'
                : pattern.includes('[*a')
                  ? '[a'.repeat(10000) + '!'
                  : 'a'.repeat(60000) + (pattern.includes('a|b') ? '!' : '/')
              const script = `
                const pm = require('picomatch')
                const [pattern, input, options] = JSON.parse(process.argv[1])
                pm(pattern, options)(input)
                pm.makeRe(pattern, options).test(input)
                pm.compileRe(pm.parse(pattern, options), options).test(input)
              `
              const child = spawnSync(process.execPath, ['-e', script, JSON.stringify([pattern, input, opts])], {
                encoding: 'utf8', timeout: 3000, killSignal: 'SIGKILL', maxBuffer: 8192
              })
              assert.equal(child.error, undefined, JSON.stringify({ pattern, options: opts, error: child.error?.code }))
              assert.equal(child.status, 0, child.stderr)
            }
          }
          console.log('bounded adversarial child cases:', patterns.length * options.length)
          NODE
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/picomatch-preview.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          npx playwright test
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: picomatch-upstream-262-diagnostics
          path: |
            frontend/test-results/
            frontend/playwright-report/
            ${{ runner.temp }}/picomatch-preview.log
          if-no-files-found: ignore
          retention-days: 3
