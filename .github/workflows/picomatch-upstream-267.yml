name: picomatch upstream PR 267 experiment

on:
  push:
    branches:
      - experiment/picomatch-upstream-267
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pin npm
        run: |
          npm install --global npm@11.19.1
          test "$(npm --version)" = "11.19.1"
      - name: Install committed dependencies
        run: npm ci
      - name: Install pinned upstream PR 267 commit for this experiment only
        run: |
          npm install --no-save --package-lock=false --ignore-scripts \
            github:Arulraj-a2b/picomatch#d9a3f12faf186860cfc86c2834c41f38701152f2
          npm ls picomatch --all
      - name: Verify Vite and Vitest resolve the candidate
        run: |
          node --input-type=commonjs <<'NODE'
          const assert = require('node:assert/strict')
          const path = require('node:path')
          const { createRequire } = require('node:module')
          const root = require.resolve('picomatch')
          const meta = require('./node_modules/picomatch/package.json')
          assert.equal(meta.name, 'picomatch')
          assert.equal(meta.version, '4.0.7')
          for (const name of ['vite', 'vitest']) {
            const resolved = createRequire(require.resolve(name)).resolve('picomatch')
            console.log(name, '->', resolved)
            assert.equal(path.resolve(resolved), path.resolve(root))
          }
          const pm = require('picomatch')
          for (const key of ['test', 'isMatch', 'makeRe', 'scan', 'parse', 'compileRe', 'matchBase']) {
            assert.equal(typeof pm[key], 'function', 'missing picomatch.' + key)
          }
          console.log('candidate package:', root, 'version:', meta.version)
          NODE
      - name: Verify Vite and Vitest matcher options
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict')
          const pm = require('picomatch')
          const matcher = pm(['**/*.ts'], {
            noextglob: true, dot: true, nocase: true,
            ignore: ['**/node_modules/**']
          })
          assert.equal(matcher('src/App.ts'), true)
          assert.equal(matcher('src/.hidden/App.TS'), true)
          assert.equal(matcher('node_modules/pkg/index.ts'), false)
          assert.equal(pm('+(foo|bar)', { noextglob: true })('foo'), false)
          assert.equal(pm.isMatch('src/.internal/test.ts', ['**/*.ts'], { dot: true }), true)
          assert.equal(pm.isMatch('src/file.js', ['**/*.ts'], { dot: true }), false)
          console.log('Vite/Vitest matcher option checks passed')
          NODE
      - name: Bound adversarial ReDoS regressions in child processes
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict')
          const { spawnSync } = require('node:child_process')
          const patterns = [
            '+(*a)', '*(*a)', '+(*)b', '+(a*)b', '+(@(*a))',
            '+(src/*/)', '+(a*b)', '*(*a)', '+(*a|b)',
            '+(a*a*a*a*a*)', '+([*a)', '+([*a])', '+(W*, *)z'
          ]
          const options = [
            {}, { dot: true }, { windows: true }, { bash: true },
            { nocase: true }, { capture: true }
          ]
          for (const pattern of patterns) {
            for (const opts of options) {
              const input = pattern.includes('W*,')
                ? 'W, '.repeat(10000) + '!'
                : pattern.includes('[*a')
                  ? '[a'.repeat(10000) + '!'
                  : 'a'.repeat(50000) + (pattern.includes('a|b') ? '!' : '/')
              const script = `
                const pm = require('picomatch')
                const [pattern, input, options] = JSON.parse(process.argv[1])
                pm(pattern, options)(input)
                pm.makeRe(pattern, options).test(input)
                pm.compileRe(pm.parse(pattern, options), options).test(input)
              `
              const child = spawnSync(process.execPath, ['-e', script, JSON.stringify([pattern, input, opts])], {
                encoding: 'utf8', timeout: 2500, killSignal: 'SIGKILL', maxBuffer: 8192
              })
              assert.equal(child.error, undefined, JSON.stringify({ pattern, options: opts, error: child.error?.code }))
              assert.equal(child.status, 0, child.stderr)
            }
          }
          console.log('bounded adversarial child cases:', patterns.length * options.length)
          NODE
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/picomatch-preview.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          npx playwright test
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: picomatch-upstream-267-diagnostics
          path: |
            frontend/test-results/
            frontend/playwright-report/
            ${{ runner.temp }}/picomatch-preview.log
          if-no-files-found: ignore
          retention-days: 3
